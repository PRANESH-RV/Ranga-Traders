<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Ranga Traders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <h1 class="logo">Ranga Traders</h1>
                <div class="nav-links">
                    <a href="index.html" class="nav-link">Home</a>
                    <button onclick="logout()" class="nav-link btn-logout">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section id="loginSection" class="login-section">
        <div class="login-container">
            <h2>Admin Login</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="adminEmail">Email:</label>
                    <input type="email" id="adminEmail" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password:</label>
                    <input type="password" id="adminPassword" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="login-note">Demo: Use any email/password to login (stored locally)</p>
        </div>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboardSection" class="dashboard-section" style="display: none;">
        <div class="container">
            <h2>Product Management Dashboard</h2>

            <!-- Add Product Form -->
            <div class="form-card">
                <h3>Add New Product</h3>
                <form onsubmit="handleAddProduct(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productName">Product Name:</label>
                            <input type="text" id="productName" required>
                        </div>
                        <div class="form-group">
                            <label for="productCategory">Category:</label>
                            <select id="productCategory">
                                <option>Cement</option>
                                <option>Steel</option>
                                <option>Tiles</option>
                                <option>Paint</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productPrice">Price:</label>
                            <input type="number" id="productPrice" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="productUnit">Unit:</label>
                            <input type="text" id="productUnit" placeholder="e.g., bag, kg, liter" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description:</label>
                        <textarea id="productDescription" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Add Product</button>
                </form>
            </div>

            <!-- Products List -->
            <div class="form-card">
                <h3>Manage Products</h3>
                <div class="table-responsive">
                    <table class="manage-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Unit</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductsTable">
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
                <p id="noAdminProducts" class="no-products" style="display: none;">No products yet. Add one above!</p>
            </div>
        </div>
    </section>

    <!-- Edit Modal -->
    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2>Edit Product</h2>
            <form onsubmit="handleEditProduct(event)">
                <input type="hidden" id="editProductId">
                <div class="form-group">
                    <label for="editProductName">Product Name:</label>
                    <input type="text" id="editProductName" required>
                </div>
                <div class="form-group">
                    <label for="editProductCategory">Category:</label>
                    <select id="editProductCategory">
                        <option>Cement</option>
                        <option>Steel</option>
                        <option>Tiles</option>
                        <option>Paint</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editProductPrice">Price:</label>
                    <input type="number" id="editProductPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="editProductUnit">Unit:</label>
                    <input type="text" id="editProductUnit" required>
                </div>
                <div class="form-group">
                    <label for="editProductDescription">Description:</label>
                    <textarea id="editProductDescription" rows="3"></textarea>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Initialize admin page
        document.addEventListener('DOMContentLoaded', function() {
            const isLoggedIn = localStorage.getItem('adminLoggedIn');
            if (isLoggedIn === 'true') {
                showDashboard();
                loadAdminProducts();
            }
        });
    </script>
</body>
</html>
